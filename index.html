<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Biblioteca</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 20px;
      color: #000000;
    }

    .hidden {
      display: none !important;
    }

    /* TELA INICIAL DE LOGIN (CONFORME ESBOÇO ANEXO 2) */
    .container-login {
      max-width: 420px;
      margin: 40px auto;
      padding: 25px;
      border: 3px solid #000000;
      border-radius: 20px;
      background: #ffffff;
    }

    .container-login h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1.5rem;
    }

    .campo-grupo {
      margin-bottom: 20px;
    }

    .campo-grupo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .campo-grupo select,
    .campo-grupo input[type="text"],
    .campo-grupo input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 3px solid #000000;
      border-radius: 12px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }

    /* BOTÃO ENTRAR (VERDE DO ESBOÇO) */
    .btn-entrar {
      background-color: #a6e22e;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 12px;
      padding: 10px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: block;
      margin-bottom: 20px;
    }

    .btn-entrar:hover {
      background-color: #8ed018;
    }

    /* LINK CADASTRAR 1º ACESSO (VERMELHO DO ESBOÇO) */
    .link-cadastro {
      margin-top: 15px;
    }

    .link-cadastro a {
      color: #d32f2f;
      font-weight: bold;
      text-decoration: none;
      font-size: 1rem;
    }

    .link-cadastro a:hover {
      text-decoration: underline;
    }

    /* CONTAINERS DOS PAINÉIS PÓS-LOGIN */
    .container {
      max-width: 800px;
      margin: 20px auto;
      background: #ffffff;
      padding: 25px;
      border: 3px solid #000000;
      border-radius: 16px;
    }

    .header-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #ddd;
      padding-bottom: 12px;
    }

    .btn-sair {
      background-color: #d32f2f;
      color: white;
      border: 2px solid #000;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    /* MENU ADMIN EM CARTÕES 2x2 */
    .grid-admin {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 450px;
      margin: 25px 0;
    }

    .card-btn {
      background-color: #ffffff;
      border: 3px solid #000000;
      border-radius: 18px;
      height: 110px;
      font-size: 1.2em;
      font-weight: bold;
      color: #000000;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-btn:hover {
      background-color: #f0f0f0;
      transform: scale(1.02);
    }

    .secao-admin {
      margin-top: 20px;
    }

    .secao-admin input {
      padding: 10px;
      border: 2px solid #000;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    /* MODAL DE PRIMEIRO ACESSO */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 16px;
      border: 3px solid #000;
      width: 90%;
      max-width: 400px;
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      margin-bottom: 12px;
      border: 2px solid #000;
      border-radius: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- 1. TELA INICIAL / LOGIN (ISOLADA) -->
  <div id="telaLogin" class="container-login">
    <h2>Sistema de Biblioteca</h2>

    <!-- MENU SUSPENSO DE PERFIL -->
    <div class="campo-grupo">
      <label for="selectPerfil">Perfil de Acesso:</label>
      <select id="selectPerfil" onchange="mudarPerfilLogin()">
        <option value="Aluno">Aluno</option>
        <option value="Professor">Professor</option>
        <option value="Administrador">Administrador</option>
      </select>
    </div>

    <!-- CAMPO CELULAR (EXIBIDO PARA ALUNO E PROFESSOR) -->
    <div id="grupoCelular" class="campo-grupo">
      <label for="telLogin">Celular:</label>
      <input type="text" id="telLogin" value="5581" placeholder="55819XXXXXXXX">
    </div>

    <!-- CAMPO SENHA ADM (EXIBIDO APENAS SE SELECIONAR ADMINISTRADOR) -->
    <div id="grupoSenhaAdmin" class="campo-grupo hidden">
      <label for="senhaAdmin">Senha de Administrador:</label>
      <input type="password" id="senhaAdmin" placeholder="Digite a senha">
    </div>

    <!-- BOTÃO ENTRAR -->
    <button id="btnEntrar" onclick="processarLogin()" class="btn-entrar">Entrar</button>

    <!-- LINK CADASTRAR 1º ACESSO -->
    <div class="link-cadastro">
      <a href="#" onclick="abrirModalPrimeiroAcesso(); return false;">cadastrar 1º acesso</a>
    </div>
  </div>


  <!-- 2. PAINEL DO ALUNO / PROFESSOR (SÓ EXIBE APÓS LOGIN DE LEITOR) -->
  <div id="painelUsuario" class="container hidden">
    <div class="header-user">
      <div>
        <h2>Acervo da Biblioteca</h2>
        <span>Olá, <b id="nomeUsuarioHeader"></b> (<span id="perfilUsuarioHeader"></span>)!</span>
      </div>
      <button onclick="sair()" class="btn-sair">Sair</button>
    </div>
    <div id="gridLivros" style="margin-top: 20px;">A carregar acervo...</div>
  </div>


  <!-- 3. PAINEL DO ADMINISTRADOR (SÓ EXIBE APÓS LOGIN DE ADMIN) -->
  <div id="painelAdmin" class="container hidden">
    <div class="header-user">
      <h2>Painel do Administrador</h2>
      <button onclick="sair()" class="btn-sair">Sair</button>
    </div>
    
    <!-- MENU EM CARTÕES 2x2 -->
    <div id="menuAdminCards" class="grid-admin">
      <button class="card-btn" onclick="mostrarSecaoAdmin('secaoCadastrar')">cadastrar</button>
      <button class="card-btn" onclick="mostrarSecaoAdmin('secaoEmprestimo')">esprestimo</button>
      <button class="card-btn" onclick="mostrarSecaoAdmin('secaoDevolucao')">devolução</button>
      <button class="card-btn" onclick="mostrarSecaoAdmin('secaoReservas')">reservas</button>
    </div>

    <!-- SECÇÃO CADASTRAR LIVRO -->
    <div id="secaoCadastrar" class="secao-admin hidden">
      <h3>Cadastrar Novo Livro</h3>
      <input type="text" id="isbnLivro" placeholder="ISBN do Livro">
      <br><br>
      <input type="text" id="tituloLivro" placeholder="Título">
      <input type="text" id="autorLivro" placeholder="Autor">
      <input type="text" id="categoriaLivro" placeholder="Categoria (ex: Romance, Didático)">
      <input type="number" id="qtdLivro" value="1" style="width: 70px;">
      <br><br>
      <button onclick="cadastrarLivro()" class="btn-entrar">Salvar Livro</button>
      <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
    </div>

    <!-- SECÇÃO REGISTRAR EMPRÉSTIMO -->
    <div id="secaoEmprestimo" class="secao-admin hidden">
      <h3>Registrar Empréstimo Manual</h3>
      <label>Telefone Aluno/Prof:</label><br>
      <input type="text" id="empTelAluno" value="5581" placeholder="55819XXXXXXXX"><br><br>
      
      <label>ISBN do Livro:</label><br>
      <input type="text" id="empIsbnLivro" placeholder="Digite ou escaneie o ISBN"><br><br>
      
      <button onclick="adminConfirmarEmprestimo()" class="btn-entrar">Confirmar Empréstimo</button>
      <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
    </div>

    <!-- SECÇÃO REGISTRAR DEVOLUÇÃO -->
    <div id="secaoDevolucao" class="secao-admin hidden">
      <h3>Registrar Devolução de Livro</h3>
      <label>ISBN do Livro a Devolver:</label><br>
      <input type="text" id="devIsbnLivro" placeholder="Digite ou escaneie o ISBN"><br><br>
      
      <button onclick="adminConfirmarDevolucao()" class="btn-entrar">Confirmar Devolução</button>
      <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
    </div>

    <!-- SECÇÃO GERENCIAR RESERVAS -->
    <div id="secaoReservas" class="secao-admin hidden">
      <h3>Fila de Espera / Reservas</h3>
      <div id="listaReservasAdmin">A carregar reservas...</div>
      <br>
      <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
    </div>
  </div>


  <!-- 4. MODAL DE CADASTRAR 1º ACESSO -->
  <div id="modalPrimeiroAcesso" class="modal hidden">
    <div class="modal-content">
      <h3>Cadastrar 1º Acesso</h3>
      <label>Nome Completo:</label>
      <input type="text" id="cadNome" placeholder="Digite seu nome">
      
      <label>Perfil:</label>
      <select id="cadPerfil">
        <option value="Aluno">Aluno</option>
        <option value="Professor">Professor</option>
      </select>
      
      <label>E-mail:</label>
      <input type="email" id="cadEmail" placeholder="seuemail@exemplo.com">
      
      <label>Celular (DDD + Número):</label>
      <input type="text" id="cadTelefone" value="5581" placeholder="55819XXXXXXXX">
      
      <div style="margin-top: 15px; display: flex; gap: 10px;">
        <button onclick="salvarPrimeiroAcesso()" class="btn-entrar" style="margin-bottom:0;">Salvar Cadastro</button>
        <button onclick="fecharModalPrimeiroAcesso()" class="btn-sair">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
