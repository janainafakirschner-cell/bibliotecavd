<!-- PAINEL ADMINISTRADOR -->
<div id="painelAdmin" class="hidden">
  <h2>Painel do Administrador</h2>

  <!-- MENU PRINCIPAL DO ADMIN -->
  <div id="menuAdminNav" style="display: flex; gap: 10px; margin-bottom: 20px;">
    <button onclick="mostrarSecaoAdmin('secaoCadastrar')">Cadastrar Livro</button>
    <button onclick="mostrarSecaoAdmin('secaoEmprestimos')">Registrar Empréstimo</button>
    <button onclick="mostrarSecaoAdmin('secaoDevolucoes')">Registrar Devolução</button>
    <button onclick="mostrarSecaoAdmin('secaoReservas')">Gerenciar Reservas</button>
    <button onclick="sair()" style="background:#d32f2f; color:#fff;">Sair</button>
  </div>

  <!-- SEÇÃO 1: CADASTRAR LIVRO -->
  <div id="secaoCadastrar" class="secao-admin">
    <h3>Cadastrar Novo Livro</h3>
    <input type="text" id="isbnLivro" placeholder="ISBN do Livro">
    <button onclick="buscarISBN()">Buscar ISBN</button>
    <button onclick="iniciarScanner()">Abrir Câmera</button>
    <br><br>
    <input type="text" id="tituloLivro" placeholder="Título">
    <input type="text" id="autorLivro" placeholder="Autor">
    <input type="number" id="qtdLivro" value="1" placeholder="Quantidade">
    <button onclick="cadastrarLivro()">Salvar Livro</button>
    <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
  </div>

  <!-- SEÇÃO 2: EMPRÉSTIMO DIRETO -->
  <div id="secaoEmprestimos" class="secao-admin hidden">
    <h3>Registrar Empréstimo Manual</h3>
    <input type="text" id="empIdAluno" placeholder="ID ou Telefone do Aluno/Prof">
    <input type="text" id="empIdLivro" placeholder="ID do Livro">
    <button onclick="adminConfirmarEmprestimo()">Confirmar Empréstimo</button>
    <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
  </div>

  <!-- SEÇÃO 3: DEVOLUÇÃO -->
  <div id="secaoDevolucoes" class="secao-admin hidden">
    <h3>Registrar Devolução de Livro</h3>
    <input type="text" id="devIdLivro" placeholder="ID do Livro a ser devolvido">
    <button onclick="adminConfirmarDevolucao()">Confirmar Devolução</button>
    <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
  </div>

  <!-- SEÇÃO 4: GERENCIAR RESERVAS -->
  <div id="secaoReservas" class="secao-admin hidden">
    <h3>Fila de Espera / Reservas</h3>
    <div id="listaReservasAdmin">A carregar reservas...</div>
    <br>
    <button onclick="voltarMenuAdmin()">← Voltar ao Menu</button>
  </div>
</div>
