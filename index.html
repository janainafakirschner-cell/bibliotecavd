<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Biblioteca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-container">
      <h1>📚 Biblioteca Digital</h1>
      <nav>
        <button id="btnNavLeitor" class="active" onclick="mudarAba('leitor')">Catálogo / Leitor</button>
        <button id="btnNavAdmin" onclick="mudarAba('admin')">Área Administrativa</button>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- ÁREA DO LEITOR -->
    <section id="secLeitor" class="aba-conteudo active">
      <div class="busca-box">
        <input type="text" id="inputBusca" placeholder="Buscar por título, autor ou categoria..." onkeyup="filtrarAcervo()">
      </div>
      <h2>Acervo de Livros</h2>
      <div id="gridAcervo" class="grid-livros">
        <!-- Livros renderizados via JS -->
      </div>
    </section>

    <!-- ÁREA ADMINISTRATIVA -->
    <section id="secAdmin" class="aba-conteudo">
      
      <!-- TELA DE LOGIN ADMIN -->
      <div id="boxLoginAdmin" class="card-form">
        <h2>Acesso do Bibliotecário</h2>
        <input type="password" id="senhaAdmin" placeholder="Digite a senha de administrador">
        <button onclick="loginAdmin()">Entrar</button>
      </div>

      <!-- PAINEL CONTROLADOR ADMIN (OCULTO ATÉ O LOGIN) -->
      <div id="painelAdmin" class="hidden">
        <div class="admin-actions">
          <button onclick="abrirModal('modalCadUsuario')">➕ Cadastrar Leitor</button>
          <button onclick="abrirModal('modalCadLivro')">➕ Cadastrar Livro</button>
          <button onclick="carregarEmprestimos()">🔄 Atualizar Listas</button>
        </div>

        <!-- OPERAÇÃO RÁPIDA: EMPRÉSTIMO -->
        <div class="card-form">
          <h3>Registrar Empréstimo Rápido</h3>
          <div class="form-grid">
            <input type="text" id="empTelefone" placeholder="Telefone do Leitor">
            <input type="text" id="empIdLivro" placeholder="ID ou ISBN do Livro">
            <button onclick="confirmarEmprestimo()">Registrar Saída</button>
          </div>
        </div>

        <!-- LISTA DE EMPRÉSTIMOS ATIVOS E DEVOLUÇÕES -->
        <h3>Empréstimos Ativos</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Leitor</th>
                <th>Telefone</th>
                <th>Livro (ID)</th>
                <th>Data Vencimento</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaEmprestimos">
              <!-- Empréstimos renderizados via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </section>

  </main>

  <!-- MODAIS -->

  <!-- Modal Cadastrar Usuário -->
  <div id="modalCadUsuario" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal('modalCadUsuario')">&times;</span>
      <h3>Cadastrar Novo Leitor</h3>
      <input type="text" id="cadNome" placeholder="Nome Completo">
      <input type="email" id="cadEmail" placeholder="E-mail">
      <input type="text" id="cadTelefone" placeholder="Telefone (com DDD)">
      <select id="cadPerfil">
        <option value="Aluno">Aluno</option>
        <option value="Professor">Professor</option>
      </select>
      <input type="text" id="cadTurma" placeholder="Turma/Classe (ex: 8º Ano A)">
      <button onclick="salvarUsuario()">Cadastrar</button>
    </div>
  </div>

  <!-- Modal Cadastrar Livro -->
  <div id="modalCadLivro" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal('modalCadLivro')">&times;</span>
      <h3>Cadastrar Novo Livro</h3>
      <input type="text" id="cadTitulo" placeholder="Título do Livro">
      <input type="text" id="cadAutor" placeholder="Autor">
      <input type="text" id="cadIsbn" placeholder="ISBN">
      <input type="text" id="cadCategoria" placeholder="Categoria/Gênero">
      <input type="text" id="cadCapa" placeholder="URL da Imagem da Capa">
      <input type="number" id="cadQtd" placeholder="Quantidade Total" value="1">
      <button onclick="salvarLivro()">Cadastrar Livro</button>
    </div>
  </div>

  <!-- Modal Confirmação de Empréstimo -->
  <div id="modalConfirmacao" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal('modalConfirmacao')">&times;</span>
      <h3>Confirmação de Dados</h3>
      <p><strong>Leitor:</strong> <span id="confNomeLeitor">-</span></p>
      <p><strong>Livro:</strong> <span id="confTituloLivro">-</span></p>
      <button onclick="executarEmprestimo()">Confirmar e Emprestar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
